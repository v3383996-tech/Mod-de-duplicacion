name: Compilar Mod Minecraft

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Capturar repositorio
        uses: actions/checkout@v4
      
      - name: Configurar Java 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          
      - name: Dar permisos a Gradle
        run: chmod +x gradlew
        
      - name: Compilar mod
        run: ./gradlew build
        
      - name: Subir archivo .jar
        uses: actions/upload-artifact@v4
        with:
          name: Mod-Duplicador-JAR
          path: build/libs/*.jar
