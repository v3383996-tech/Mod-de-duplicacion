name: Compilar Mod Minecraft

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Configurar Java 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'zulu'
      - name: Dar permisos a gradlew
        run: chmod +x gradlew
      - name: Compilar mod
        run: ./gradlew build
      - name: Subir el archivo .jar
        uses: actions/upload-artifact@v3
        with:
          name: Mod-JAR
          path: build/libs/*.jar
